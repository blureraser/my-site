<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Blur3raser 的个人站">
<title>{{ if .IsHome }}Blur3raser - 个人主页{{ else }}{{ .Title }} - Blur3raser{{ end }}</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/posts.css">
<link rel="stylesheet" href="/rail.css?v={{ now.Unix }}">
<script defer src="/rail.js?v={{ now.Unix }}"></script>
<!-- KaTeX: md 中 LaTeX 公式渲染 -->
<link rel="stylesheet" href="/katex/katex.min.css">
<script defer src="/katex/katex.min.js"></script>
<script defer src="/katex/auto-render.min.js"></script>
<script>
  (() => {
    const opts = {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "$", right: "$", display: false },
        { left: "\\(", right: "\\)", display: false },
        { left: "\\[", right: "\\]", display: true }
      ],
      throwOnError: false
    };
    document.addEventListener("DOMContentLoaded", () => {
      renderMathInElement(document.body, opts);
    });
    // rail.js 的局部导航只替换 <main>，公式需要对新内容重新渲染
    window.addEventListener("rail:partial", () => {
      const main = document.querySelector("main");
      if (main) renderMathInElement(main, opts);
    });
  })();
</script>
